[package]
name = "bonuz-id-registry"
description = "bonuz ID registry on NEAR: links NEAR accounts to bonuz ID handles"
version = "2.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bonuz-market/bonuz-id-near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
bs58 = "0.5"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
borsh = { version = "1", features = ["derive"] }
base64 = "0.22"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
